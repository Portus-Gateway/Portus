[package]
name = "portus-dataplane"
version = "0.4.0"
edition = "2024"
rust-version.workspace = true
description = "Portus data plane: portus-dataplane-core served on the Rama network stack"
license = "Apache-2.0"
repository = "https://github.com/Portus-Gateway/Portus"
keywords = ["proxy", "gateway-api", "rama", "networking"]
categories = ["network-programming"]

[dependencies]
portus-dataplane-core = { path = "../portus-dataplane-core" }
rama = { version = "0.4.0", features = ["http-full", "rustls", "ring"] }
x509-parser = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
prometheus = { workspace = true }
log = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
mimalloc = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
rustls = { workspace = true }
hashbrown = { workspace = true }
arrayvec = { workspace = true }
rand = "0.10"

[dev-dependencies]
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
