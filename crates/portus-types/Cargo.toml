[package]
name = "portus-types"
version = "0.2.12"
edition = "2024"
rust-version.workspace = true
description = "Shared protobuf types for Portus Gateway API proxy"
license = "Apache-2.0"
repository = "https://github.com/Portus-Gateway/Portus"
keywords = ["protobuf", "gateway-api", "types"]
categories = ["network-programming"]

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"], optional = true }
serde_json = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[features]
# Fetching issuers' JWKS (controller and ledger).
jwks = ["dep:reqwest", "dep:serde_json", "dep:rustls"]

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
