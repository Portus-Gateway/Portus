# k3s advertises the stable dummy address and flannel derives the pod MTU from it (65535).
# Pods reach 10.99.0.1 as a host-local address, so the kubernetes Service and
# the supervisor never point at a lease that has moved.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do ip -4 addr show node0 2>/dev/null | grep -q "inet 10.99.0.1" && exit 0; sleep 1; done; echo "node0 has no address" >&2; exit 1'
ExecStart=
ExecStart=/usr/local/bin/k3s server --disable traefik --disable servicelb --write-kubeconfig-mode 644 \
  --node-ip 10.99.0.1 --advertise-address 10.99.0.1 --flannel-iface node0 --tls-san portus.machine --tls-san portus
