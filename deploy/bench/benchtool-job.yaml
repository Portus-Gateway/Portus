# Rendered by deploy/bench/render-job.py: runs howardjohn/benchtool (fortio)
# inside the cluster against the Gateway addresses in BENCH_TARGETS.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${BENCH_JOB_NAME}
  namespace: bench
  labels:
    app.kubernetes.io/name: ${BENCH_JOB_NAME}
    app.kubernetes.io/part-of: benchtool
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${BENCH_JOB_NAME}
        app.kubernetes.io/part-of: benchtool
    spec:
      restartPolicy: Never
      containers:
        - name: benchtool
          image: howardjohn/benchtool
          args: [${BENCH_ARGS_JSON}, "${BENCH_TARGETS}"]
          # A scheduling hint only (no limit). Kept small so two generators fit
          # next to the 3 x 2-CPU bench dataplane pods on a 10-CPU node: with
          # "2" the second generator sat Pending until the first finished and
          # a "two generator" run was two sequential runs summed.
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
