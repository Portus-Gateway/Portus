apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portus
  namespace: bench
spec:
  gatewayClassName: portus-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portus
  namespace: bench
spec:
  parentRefs:
    - name: portus
  rules:
    - backendRefs:
        - name: backend
          port: 80
