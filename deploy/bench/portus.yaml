apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portus
  namespace: bench
spec:
  gatewayClassName: portus-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: bench-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portus
  namespace: bench
spec:
  parentRefs:
    - name: portus
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /echo
      backendRefs:
        - name: echo
          port: 80
    - backendRefs:
        - name: backend
          port: 80
