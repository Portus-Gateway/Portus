apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apikeyauthpolicies.portus-gateway.dev
  labels:
    gateway.networking.k8s.io/policy: direct
spec:
  group: portus-gateway.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, apiKey]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Gateway]
                    name:
                      type: string
                    sectionName:
                      type: string
                apiKey:
                  type: object
                  required: [secretRef]
                  properties:
                    secretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                    headerName:
                      type: string
                      default: "X-API-Key"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: apikeyauthpolicies
    singular: apikeyauthpolicy
    kind: APIKeyAuthPolicy
    shortNames: [akap]
