apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ratelimitpolicies.portus-gateway.dev
  labels:
    gateway.networking.k8s.io/policy: direct
spec:
  group: portus-gateway.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, rateLimit]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Gateway]
                    name:
                      type: string
                    sectionName:
                      type: string
                rateLimit:
                  type: object
                  required: [requestsPerSecond]
                  properties:
                    requestsPerSecond:
                      type: integer
                      minimum: 1
                    perClient:
                      type: boolean
                      default: false
                      description: "When true, each client IP gets its own rate limit bucket instead of sharing one per route."
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: ratelimitpolicies
    singular: ratelimitpolicy
    kind: RateLimitPolicy
    shortNames: [rlp]
