apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: extauthpolicies.portus-gateway.dev
  labels:
    gateway.networking.k8s.io/policy: direct
spec:
  group: portus-gateway.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Service
          type: string
          jsonPath: .spec.extAuth.backendRef.name
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, extAuth]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Gateway]
                    name:
                      type: string
                    sectionName:
                      type: string
                extAuth:
                  type: object
                  required: [backendRef]
                  properties:
                    backendRef:
                      type: object
                      description: The authorization Service. Another namespace needs a ReferenceGrant from portus-gateway.dev/ExtAuthPolicy.
                      required: [name, port]
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                    path:
                      type: string
                      description: Path of the check request (default /).
                      pattern: '^/'
                    timeoutMs:
                      type: integer
                      description: How long to wait for a decision (default 1000).
                      minimum: 1
                      maximum: 60000
                    failOpen:
                      type: boolean
                      description: Allow requests when the service cannot answer (default false, 503).
                    requestHeaders:
                      type: array
                      description: Client headers sent to the service. All of them when empty.
                      items:
                        type: string
                    responseHeaders:
                      type: array
                      description: Service response headers copied into the backend request on a 2xx; client copies are removed.
                      items:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: extauthpolicies
    singular: extauthpolicy
    kind: ExtAuthPolicy
    shortNames: [eap]
