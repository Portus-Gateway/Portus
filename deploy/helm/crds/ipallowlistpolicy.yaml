apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipallowlistpolicies.portus-gateway.dev
  labels:
    gateway.networking.k8s.io/policy: direct
spec:
  group: portus-gateway.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Gateway]
                    name:
                      type: string
                    sectionName:
                      type: string
                allowCIDRs:
                  type: array
                  items:
                    type: string
                denyCIDRs:
                  type: array
                  items:
                    type: string
                trustedProxyCIDRs:
                  type: array
                  items:
                    type: string
                  description: "CIDRs of trusted proxies/LBs. When set, the real client IP is extracted from X-Forwarded-For by walking backward and stopping at the first untrusted hop."
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: ipallowlistpolicies
    singular: ipallowlistpolicy
    kind: IPAllowlistPolicy
    shortNames: [ipalp]
