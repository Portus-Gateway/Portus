apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiproviders.portus-gateway.dev
spec:
  group: portus-gateway.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [anthropic, openai, openai-compatible, mcp, mcp-federation]
                url:
                  type: string
                  description: "Base URL, scheme and host only: https://api.anthropic.com. Required except for mcp-federation"
                members:
                  type: array
                  description: "mcp-federation: the MCP providers behind this one endpoint. Each member's tools appear as <name>.<tool>; tools/call on such a name goes to that member; initialize and tools/list are answered by the gateway; every member session travels inside the client's Mcp-Session-Id"
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: "Tool-name prefix (letters, digits, - or _), unique in the federation"
                      provider:
                        type: string
                        description: "The member AIProvider (kind mcp, same namespace); default: name"
                      path:
                        type: string
                        description: "Where the member serves MCP; default /mcp"
                sessionAffinity:
                  type: string
                  enum: [header, none]
                  description: "header pins Mcp-Session-Id sessions to one endpoint (default for mcp); none load-balances every request"
                credential:
                  type: object
                  required: [secretRef]
                  properties:
                    secretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          description: "Key in the Secret's data; default api-key"
                    header:
                      type: string
                      description: "Header carrying the key; default x-api-key (anthropic) or authorization"
                    prefix:
                      type: string
                      description: "Text before the key in the header value; default empty (anthropic) or 'Bearer '"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: aiproviders
    singular: aiprovider
    kind: AIProvider
    shortNames: [aip]
