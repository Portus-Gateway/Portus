apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: timeoutpolicies.portus-gateway.dev
  labels:
    gateway.networking.k8s.io/policy: direct
spec:
  group: portus-gateway.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, timeout]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Gateway]
                    name:
                      type: string
                    sectionName:
                      type: string
                timeout:
                  type: object
                  properties:
                    requestTimeoutMs:
                      type: integer
                      minimum: 0
                    backendRequestTimeoutMs:
                      type: integer
                      minimum: 0
                    connectTimeoutMs:
                      type: integer
                      minimum: 0
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: timeoutpolicies
    singular: timeoutpolicy
    kind: TimeoutPolicy
    shortNames: [tp]
