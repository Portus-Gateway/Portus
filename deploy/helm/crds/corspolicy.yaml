apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: corspolicies.portus-gateway.dev
  labels:
    gateway.networking.k8s.io/policy: direct
spec:
  group: portus-gateway.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, cors]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Gateway]
                    name:
                      type: string
                    sectionName:
                      type: string
                cors:
                  type: object
                  properties:
                    allowOrigins:
                      type: array
                      items:
                        type: string
                    allowMethods:
                      type: array
                      items:
                        type: string
                    allowHeaders:
                      type: array
                      items:
                        type: string
                    exposeHeaders:
                      type: array
                      items:
                        type: string
                    allowCredentials:
                      type: boolean
                    maxAge:
                      type: integer
                      minimum: 0
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: corspolicies
    singular: corspolicy
    kind: CORSPolicy
    shortNames: [corsp]
