# Global
nameOverride: ""
fullnameOverride: ""

controller:
  image:
    repository: ghcr.io/portus-gateway/controller
    tag: ""  # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  grpcPort: 50051
  logLevel: info
  gatewayClassName: portus-gateway
  controllerName: "github.com/Portus-Gateway/Portus"

# The controller provisions a dedicated dataplane Deployment, Service and
# PodDisruptionBudget for every Gateway (owned by the Gateway, garbage-collected
# with it). Each dataplane receives only its Gateway's config and the Service's
# address is what the Gateway reports. These values are the template.
dataplane:
  replicasPerGateway: 2
  image:
    repository: ghcr.io/portus-gateway/dataplane
    tag: ""  # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi
  logLevel: info
  # Per-request access log (one line per request on stderr). Off by default:
  # at 100k+ requests/s it costs measurable CPU and floods the log pipeline.
  accessLog: false
  # Proxy worker threads per dataplane pod. Empty: sized from the pod's cgroup
  # CPU limit if one is set, else the node's CPU count (the pods have no CPU
  # limit by default, so they can use spare cores under load).
  threads: ""
  # Network stack the dataplane pods serve traffic on. The release image
  # carries both: `rama` (the default since 0.2.4) and `pingora`. A value the
  # image does not carry fails the pod at start with a log line naming it.
  networkStack: rama
  controllerUrl: ""  # gRPC config stream; auto-generated from the controller Service if empty
  service:
    type: LoadBalancer
    annotations: {}

# mTLS on the controller -> dataplane config stream. It carries the compiled
# routing config, Gateway TLS private keys and auth credentials, so it is on by
# default: the chart generates a CA and a certificate for the controller
# Service on first install and keeps them across upgrades. The controller
# copies the Secret into every Gateway's namespace for its dataplane pods.
grpcTls:
  enabled: true
  # Bring your own Secret (ca.crt, tls.crt, tls.key) instead of the generated
  # one. Its server certificate must name the controller Service
  # (<release>-portus-gateway-controller.<namespace>) or dataplane.controllerUrl.
  secretName: ""
  # enabled: false sends everything in plaintext; local development only.

serviceAccount:
  create: true
  name: ""
  annotations: {}

# AI gateway. Off by default. When enabled the chart deploys the ledger, the
# companion service that receives usage records from the data planes (and,
# in later releases, issues API keys and holds budgets). The data planes
# report to it over the same mTLS CA as the config stream; on a fresh install
# the generated certificate also names the ledger Service. An existing
# install first created before 0.2.6 must delete the generated grpc-tls
# Secret once so it is regenerated with the ledger's names (from 0.2.6 the
# names are always in it). Pass your values with -f on every upgrade rather
# than --reuse-values: the reuse flags ignore new chart defaults, and after a
# failed revision they can drop values you set, which turns this off again.
aiGateway:
  enabled: false
  ledger:
    image:
      repository: ghcr.io/portus-gateway/ledger
      tag: ""  # defaults to the chart's appVersion
      pullPolicy: IfNotPresent
    grpcPort: 9444
    httpPort: 8083
    # Bring your own Secret (key `token`) for the key admin API; empty
    # generates one on first install.
    adminTokenSecretName: ""
    # Serve /export.jsonl and /v1/summary without the admin token. Usage rows
    # name keys, tenants and subjects; leave this off unless nothing but
    # operators can reach the ledger's port.
    openReads: false
    # Budget and refusal events POSTed to a webhook (JSON, one event per
    # request, at least once: deduplicate on the event's "id"). Empty url: off.
    webhook:
      url: ""
      # Secret (key secretKey) with the HMAC key; each request carries
      # x-portus-signature: sha256=<hex HMAC-SHA256 of the body>.
      secretName: ""
      secretKey: secret
      # Percent of a subject's limit; each fires once per subject and window.
      thresholds: [80, 100]
      # Refusal kinds that become events: unauthenticated, model_not_allowed,
      # tool_not_allowed, budget_exhausted. [none] for no refusal events.
      refusals: [model_not_allowed, tool_not_allowed, budget_exhausted]
    # Persistent volume for the SQLite ledger. Empty storageClassName uses
    # the cluster default.
    storage:
      size: 1Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
  # OAuth issuers whose bearer tokens AIRoutes may accept (AIRoute
  # spec.auth.jwt.issuer must be one of them). The ledger fetches each
  # issuer's JWKS every 5 minutes and pushes it to the data planes.
  jwt:
    issuers: []
