{{- /*
Bearer token for the ledger's key admin API, generated on first install and
reused on upgrades. Bring your own with aiGateway.ledger.adminTokenSecretName
(key `token`).
*/ -}}
{{- if and .Values.aiGateway.enabled (empty .Values.aiGateway.ledger.adminTokenSecretName) }}
{{- $name := include "portus-gateway.ledgerAdminSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "portus-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger
type: Opaque
data:
  {{- if $existing }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
