{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    # A CRD deletion deletes every object of its kind: uninstall keeps them.
    helm.sh/resource-policy: keep
  name: circuitbreakerpolicies.portus-gateway.dev
  labels:
    gateway.networking.k8s.io/policy: direct
spec:
  group: portus-gateway.dev
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, circuitBreaker]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Service]
                    name:
                      type: string
                    sectionName:
                      type: string
                circuitBreaker:
                  type: object
                  required: [failureThreshold, successThreshold, timeoutSecs]
                  properties:
                    failureThreshold:
                      type: integer
                      minimum: 1
                    successThreshold:
                      type: integer
                      minimum: 1
                    timeoutSecs:
                      type: integer
                      minimum: 1
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      deprecationWarning: "portus-gateway.dev/v1alpha1 is deprecated; use portus-gateway.dev/v1beta1"
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef, circuitBreaker]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                      enum: [HTTPRoute, GRPCRoute, Service]
                    name:
                      type: string
                    sectionName:
                      type: string
                circuitBreaker:
                  type: object
                  required: [failureThreshold, successThreshold, timeoutSecs]
                  properties:
                    failureThreshold:
                      type: integer
                      minimum: 1
                    successThreshold:
                      type: integer
                      minimum: 1
                    timeoutSecs:
                      type: integer
                      minimum: 1
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
  scope: Namespaced
  names:
    plural: circuitbreakerpolicies
    singular: circuitbreakerpolicy
    kind: CircuitBreakerPolicy
    shortNames: [cbp]
{{- end }}
