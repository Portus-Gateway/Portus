{{- /*
mTLS material for the controller <-> dataplane config stream, generated on
first install and reused on every upgrade (`lookup`), so the default install
is encrypted and authenticated without any manual step. Bring your own by
setting grpcTls.secretName (ca.crt, tls.crt, tls.key; the server cert must
name the controller Service, or whatever dataplane.controllerUrl points at).
The controller copies this Secret into every Gateway's namespace for its
dataplane pods.
*/ -}}
{{- if and .Values.grpcTls.enabled (empty .Values.grpcTls.secretName) }}
{{- $name := include "portus-gateway.grpcTlsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "portus-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
type: kubernetes.io/tls
data:
  {{- if $existing }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $svc := include "portus-gateway.controllerServiceName" . }}
  {{- $sans := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svc .Release.Namespace) }}
  {{- $ca := genCA (printf "%s-ca" $svc) 3650 }}
  {{- $cert := genSignedCert $svc nil $sans 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
