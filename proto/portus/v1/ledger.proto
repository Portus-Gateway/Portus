syntax = "proto3";

package portus.ledger.v1;

// Usage reporting from data planes to the ledger. One unary call per batch:
// the data plane drains its ring into a batch, sends it, and only forgets
// the records once the ledger has acknowledged them.
service LedgerIngest {
  rpc Report(UsageBatch) returns (ReportAck);
}

message UsageBatch {
  // Data plane pod identity, for de-duplication and diagnostics.
  string node = 1;
  repeated UsageRecord records = 2;
  // Records the data plane dropped because its ring was full, since start.
  uint64 dropped_total = 3;
}

message UsageRecord {
  uint64 ts_unix_micros = 1;
  uint64 duration_micros = 2;
  uint32 status = 3;
  string dialect = 4;          // anthropic | openai
  bool stream = 5;
  string provider = 6;         // AIProvider name
  string route_host = 7;       // request Host the route matched on
  string requested_model = 8;  // body `model`
  string served_model = 9;     // response `model`, when reported
  bool has_usage = 10;         // false: the response carried no usage block
  uint32 input_tokens = 11;
  uint32 output_tokens = 12;
  uint32 cache_read_tokens = 13;
  uint32 cache_creation_tokens = 14;
  uint64 request_bytes = 15;
  uint64 response_bytes = 16;
  uint64 key_id = 17;          // 0 until API keys exist
  uint64 request_id = 18;
}

message ReportAck {
  uint64 accepted = 1;
}

// Token budgets. Every data plane keeps a local spent counter per subject
// and syncs the delta to the ledger about once a second (sooner under
// load); the ledger answers with the window's global total. Remaining is
// budget minus the global total minus what this pod has not synced yet, so
// the overrun is bounded by one sync interval of spend, not by grants.
service Budget {
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message SyncRequest {
  string node = 1;
  string policy = 2;          // namespace/name of the AIUsagePolicy
  string subject = 3;         // key id, tenant or "route", per the policy
  string window = 4;          // HOURLY | DAILY | MONTHLY
  // Tokens this pod has spent in the window since its last sync.
  uint64 spent_delta = 5;
}

message SyncResponse {
  // Everything spent in the window across all pods, this delta included.
  uint64 spent_total = 1;
  uint64 window_end_unix_micros = 2;
}

// API keys, pushed from the ledger to every data plane as whole snapshots.
// The data plane only ever sees hashes; the ledger keeps hashes too. A key's
// plaintext exists once, in the response that issued it.
service KeyDistribution {
  rpc WatchKeys(KeyWatchRequest) returns (stream KeySnapshot);
}

message KeyWatchRequest {
  string node = 1;
}

message KeySnapshot {
  // Monotonic per ledger process; a data plane applies a snapshot only when
  // its version is higher than what it holds.
  uint64 version = 1;
  repeated KeyEntry keys = 2;
}

message KeyEntry {
  uint64 id = 1;
  bytes hash_sha256 = 2;
  string tenant = 3;
  string name = 4;
  // Empty: any model.
  repeated string allowed_models = 5;
}
